
name: Gerar APK AUTO SOCORRO VALEN V8.3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair V8.3
        run: |
          mkdir -p projeto
          unzip -oq AUTO_SOCORRO_VALEN_V8_3_ESTRUTURA_REVISADA.zip -d projeto
          test -f projeto/app/build.gradle
          test -f projeto/app/src/main/AndroidManifest.xml

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: projeto
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-SOCORRO-VALEN-V8-3
          path: projeto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
