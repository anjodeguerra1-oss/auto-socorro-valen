
name: Gerar APK VALEN MOTORISTA V8.7 GPS verificado

on:
  workflow_dispatch:

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Confirmar ZIP e versao V8.7
        shell: bash
        run: |
          set -euo pipefail
          ARQUIVO="AUTO_SOCORRO_VALEN_V8_7_GPS_SEGUNDO_PLANO.zip"
          test -f "$ARQUIVO"
          echo "4fd3c94d88cbc1bcaad6bb7afbad12b0d761cbf795300c98a49370ba6bf0d344  $ARQUIVO" | sha256sum -c -
          mkdir -p projeto
          unzip -oq "$ARQUIVO" -d projeto
          test -f projeto/app/src/main/java/br/com/valen/motorista/ValenTrackingService.java
          test -f projeto/app/src/main/java/br/com/valen/motorista/ValenSecureStore.java
          test -f projeto/app/src/main/AndroidManifest.xml
          grep -Eq 'versionCode[[:space:]]+87' projeto/app/build.gradle
          grep -Fq "versionName '8.7.0-test'" projeto/app/build.gradle
          grep -Fq 'VALEN-MOTORISTA-V8.7' projeto/app/src/main/assets/index.html
          grep -Fq 'foregroundServiceType="location"' projeto/app/src/main/AndroidManifest.xml
          echo 'Projeto V8.7 GPS confirmado.'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        run: |
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK V8.7
        working-directory: projeto
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Conferir APK V8.7 e GPS
        shell: bash
        run: |
          set -euo pipefail
          APK="projeto/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee projeto/versao-apk.txt
          grep -F "versionCode='87' versionName='8.7.0-test'" projeto/versao-apk.txt
          grep -F "package: name='br.com.valen.motorista'" projeto/versao-apk.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > projeto/manifesto-apk.txt
          grep -F 'ValenTrackingService' projeto/manifesto-apk.txt
          unzip -p "$APK" assets/index.html > projeto/asset-verificado.html
          grep -Fq 'VALEN-MOTORISTA-V8.7' projeto/asset-verificado.html
          rm -f projeto/asset-verificado.html
          sha256sum "$APK" | tee projeto/sha256-apk.txt

      - name: Disponibilizar APK V8.7
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-SOCORRO-VALEN-V8-7-GPS-TESTE
          path: |
            projeto/app/build/outputs/apk/debug/app-debug.apk
            projeto/versao-apk.txt
            projeto/manifesto-apk.txt
            projeto/sha256-apk.txt
          if-no-files-found: error
          
